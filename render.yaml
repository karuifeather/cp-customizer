services:
  - type: web
    name: sneaker-studio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/items
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sneaker-studio-db
          property: connectionString

databases:
  - name: sneaker-studio-db
    plan: free
